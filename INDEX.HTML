<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Billboard</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: radial-gradient(circle at top, #0f2027, #000);
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  overflow: hidden;
}

/* Floating particles */
body::before {
  content: "";
  position: absolute;
  width: 200%;
  height: 200%;
  background-image: radial-gradient(white 1px, transparent 1px);
  background-size: 50px 50px;
  animation: moveStars 20s linear infinite;
  opacity: 0.2;
}

@keyframes moveStars {
  from { transform: translateY(0); }
  to { transform: translateY(-100px); }
}

.container {
  text-align: center;
  animation: fadeIn 1.5s ease-in-out;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

img {
  width: 110px;
  border-radius: 50%;
  margin-bottom: 15px;
  animation: float 3s ease-in-out infinite;
  box-shadow: 0 0 20px #00c6ff;
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

h1 {
  font-size: 2.5em;
  margin-bottom: 10px;
  text-shadow: 0 0 10px #00c6ff;
}

/* Typing text */
#typing {
  font-size: 1.2em;
  border-right: 2px solid white;
  white-space: nowrap;
  overflow: hidden;
  width: 0;
  animation: typing 4s steps(40, end) forwards, blink 0.7s infinite;
}

@keyframes typing {
  to { width: 100%; }
}

@keyframes blink {
  50% { border-color: transparent; }
}

.btn {
  display: inline-block;
  padding: 12px 20px;
  margin: 12px;
  border-radius: 30px;
  text-decoration: none;
  color: white;
  background: linear-gradient(45deg, #00c6ff, #0072ff);
  transition: 0.3s;
  box-shadow: 0 0 10px #00c6ff;
}

.btn:hover {
  transform: scale(1.1);
  box-shadow: 0 0 20px #00c6ff, 0 0 40px #0072ff;
}

/* Button click ripple */
.btn:active {
  transform: scale(0.95);
}
</style>
</head>

<body>

<div class="container">
  <img src="../Camera Roll/WIN_20260420_14_53_48_Pro.jpg" alt="Profile">

  <h1>Chukwuebuka's underaged sites creates</h1>

  <p id="typing">
    🔥 This is one of the million ways i make ur business boom so give me 10K+ and i will make ur yearly income zoom 🚀
  </p>

  <br><br>

  <a href="#" class="btn">My Projects</a>
  <a href="#" class="btn">Contact Me</a>
</div>

</body>
</html>
